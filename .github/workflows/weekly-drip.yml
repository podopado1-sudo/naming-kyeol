# 주간 드립 개방: 일요일 새벽 KST에 스탬프 커밋 → Vercel 재빌드 → pa 도래 이름 코호트 공개.
# ignoreCommand(frontend 외 변경 빌드 생략)와 충돌하지 않도록 frontend/ 안의 스탬프를 갱신한다.
# 운영 노트 (2026-09-03 배포 전 리뷰):
#   - 분(minute)은 정각을 피한다 — GitHub cron은 정각 혼잡 시 지연·드롭됨 (keepalive.yml과 동일 전략).
#   - 스케줄이 통째로 드롭된 주는 run이 없어 실패 메일도 없다. 다음 주 게이트가 직전 스탬프 뒤의 pa 를 모두 보므로
#     밀린 코호트까지 함께 스탬프·공개한다(빌드는 pa <= 빌드일을 연다) — 피해는 최대 7일 지연 (자가 치유).
#     수동 보정은 Actions 탭에서 workflow_dispatch 실행(열리는 코호트가 없어도 빌드하려면 force).
# 게이트 (2026-11-27 — scripts/drip-gate.mjs, 테스트 frontend/tests/fix1127-infra.test.mjs):
#   - 직전 스탬프(drip-stamp.txt 의 시각, KST 날짜) 초과 ~ 오늘(KST) 이하에 새로 열리는 pa 가 있을 때만 스탬프한다.
#     옛 게이트('마지막 pa 경과' 하나)는 드립 정지 기간(10/25 다음 코호트 12/27)에도 매주 빈 스탬프로 전량 재빌드를 냈다.
#     모든 코호트가 개방된 뒤에도 같은 규칙으로 생략된다.
#   - 스탬프는 frontend/ 만 바꾸므로 커밋 메시지에 [skip render] — Render 재배포를 하지 않는다.
name: Weekly name drip

on:
  schedule:
    - cron: "23 20 * * 6"  # 토 20:23 UTC = 일 05:23 KST
  workflow_dispatch:
    inputs:
      force:
        description: "새로 열리는 코호트가 없어도 스탬프 커밋(Vercel 빌드)을 만든다"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stamp only when a cohort opens
        id: gate
        env:
          DRIP_FORCE: ${{ inputs.force }}
        run: node scripts/drip-gate.mjs
      - name: Update drip stamp
        if: steps.gate.outputs.stamp == 'true'
        run: date -u +"%Y-%m-%dT%H:%M:%SZ" > frontend/drip-stamp.txt
      - name: Commit & push
        if: steps.gate.outputs.stamp == 'true'
        run: |
          git config user.name "drip-bot"
          git config user.email "actions@github.com"
          git add frontend/drip-stamp.txt
          git commit -m "chore(drip): weekly cohort release stamp [skip render]" || exit 0
          git push
