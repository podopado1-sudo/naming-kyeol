name: Keepalive & uptime check

# Render Free 플랜은 15분 idle 시 spin-down → 첫 요청이 30초+ 걸림 → 10분 간격 ping으로 회피.
# (GitHub Actions cron은 부하에 따라 수십 분 지연될 수 있음 — 실측 약 1시간 간격까지 밀린 전력.
#  정시(:00) 혼잡을 피하려고 오프셋 분을 사용하지만 근본 해결은 아님)
# 프론트(namingkyeol.com)는 keepalive가 필요 없지만 다운 감지용으로 함께 확인 —
# 3회 연속 비200이면 run을 실패시켜 GitHub 실패 알림 메일로 다운을 인지.
# (2026-07-30 Vercel Hobby 한도 초과 정지로 전 페이지가 402를 반환했는데 감시 부재로 뒤늦게 발견한 사후 대책)
# 주의: 저장소에 60일간 커밋이 없으면 GitHub이 스케줄 워크플로를 자동 비활성화함 — 알림 메일에서 재활성화 가능.

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Ping backend API (Render cold start 방지)
        id: backend
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 \
              "https://naming-kyeol-api.onrender.com/api/v1/recommendations/hanja-stats" || echo 000)
            echo "attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::backend API가 3회 연속 응답 실패 (마지막: HTTP $status)"
          exit 1

      - name: Check frontend (namingkyeol.com 다운 감지)
        id: frontend
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://namingkyeol.com/" || echo 000)
            echo "attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::프론트가 3회 연속 비200 (마지막: HTTP $status) — Vercel 정지(402)/장애 여부 확인 필요"
          exit 1

      - name: Fail run if any check failed (실패 알림 메일 트리거)
        if: steps.backend.outcome == 'failure' || steps.frontend.outcome == 'failure'
        run: |
          echo "backend: ${{ steps.backend.outcome }} / frontend: ${{ steps.frontend.outcome }}"
          exit 1
